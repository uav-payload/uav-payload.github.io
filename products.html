<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products - UAV Payload Technology</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background-color: #0b1120; color: #f1f5f9; line-height: 1.6; }

        /* Navigation Header */
        header { background-color: rgba(11, 17, 32, 0.9); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 100; border-bottom: 1px solid #1e293b; }
        nav { max-width: 1200px; margin: 0 auto; padding: 20px; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.5rem; font-weight: 800; color: #fff; text-decoration: none; }
        .logo span { color: #0ea5e9; }
        .nav-links a { color: #cbd5e1; text-decoration: none; margin-left: 30px; font-weight: 600; transition: color 0.3s; }
        .nav-links a:hover { color: #0ea5e9; }

        /* Filter Navigation - Simplified to 5 Core Categories */
        .filter-nav { max-width: 1200px; margin: 30px auto; padding: 0 20px; display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
        .filter-btn { 
            padding: 12px 20px; 
            background: #1e293b; 
            border: 1px solid #334155; 
            color: #cbd5e1; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: 600; 
            transition: all 0.3s; 
            font-size: 0.9rem;
            text-transform: uppercase;
        }
        .filter-btn.active, .filter-btn:hover { background: #0ea5e9; color: #fff; border-color: #0ea5e9; }

        .container { max-width: 1200px; margin: 0 auto; padding: 20px; min-height: 60vh; }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 30px; }
        
        /* Product Card Style */
        .product-card { background: #1e293b; border-radius: 16px; border: 1px solid #334155; overflow: hidden; transition: 0.3s; display: flex; flex-direction: column; cursor: pointer; }
        .product-card:hover { transform: translateY(-8px); border-color: #0ea5e9; box-shadow: 0 20px 40px rgba(0,0,0,0.4); }
        
        .product-img { width: 100%; height: 240px; background: #0f172a; position: relative; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .product-img img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .badge { position: absolute; top: 15px; right: 15px; background: rgba(14, 165, 233, 0.15); color: #0ea5e9; padding: 4px 12px; border-radius: 6px; font-size: 0.75rem; font-weight: 700; border: 1px solid #0ea5e9; }

        .product-detail { padding: 25px; flex-grow: 1; }
        .product-detail h3 { color: #fff; margin-bottom: 10px; font-size: 1.25rem; }
        .product-detail p { color: #94a3b8; font-size: 0.9rem; margin-bottom: 20px; }
        
        .specs { border-top: 1px solid #334155; padding-top: 15px; }
        .spec-item { display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 6px; }
        .spec-label { color: #64748b; }
        .spec-value { color: #cbd5e1; font-weight: 600; }

        #no-products { display: none; text-align: center; padding: 80px; color: #64748b; font-size: 1.1rem; }

        footer { text-align: center; padding: 60px; color: #475569; font-size: 0.9rem; border-top: 1px solid #1e293b; }
    </style>
</head>
<body>

    <header>
        <nav>
            <a href="index.html" class="logo">UAV <span>Payload</span></a>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="products.html" style="color: #0ea5e9;">Products</a>
                <a href="about.html">About</a>
                <a href="news.html">News</a>
                <a href="contact.html">Contact</a>
            </div>
        </nav>
    </header>

    <div class="filter-nav">
        <button class="filter-btn active" data-filter="all">All Solutions</button>
        <button class="filter-btn" data-filter="matrice400">M400 Series</button>
        <button class="filter-btn" data-filter="matrice4t">M30/M4T Series</button>
        <button class="filter-btn" data-filter="cargo">Cargo & Firefighting</button>
        <button class="filter-btn" data-filter="radar">Radar Systems</button>
        <button class="filter-btn" data-filter="others">Other Solutions</button>
    </div>

    <div class="container">
        <div id="no-products">No products found in this category.</div>
        
        <div class="product-grid" id="product-list">
            
            <div class="product-card" data-type="matrice400" onclick="location.href='product-ft100max.html'">
                <div class="product-img">
                    <span class="badge">M400 Series</span>
                    <img src="images/FT100MAX_Icon.jpg" alt="FT100 MAX">
                </div>
                <div class="product-detail">
                    <h3>FT100 MAX Visual Drop System</h3>
                    <p>Advanced 4-channel release mechanism with 1080P camera and RGB warning lights.</p>
                    <div class="specs">
                        <div class="spec-item"><span class="spec-label">Model</span><span class="spec-value">FT100 MAX</span></div>
                        <div class="spec-item"><span class="spec-label">Payload</span><span class="spec-value">Max 24kg</span></div>
                    </div>
                </div>
            </div>

            </div>
    </div>

    <footer>
        <p>© 2026 UAV Payload Technology. All rights reserved.</p>
    </footer>

    <script>
        const filterBtns = document.querySelectorAll('.filter-btn');
        const productCards = document.querySelectorAll('.product-card');
        const noProductsMsg = document.getElementById('no-products');

        function applyFilter(filterType) {
            let count = 0;
            // 更新按钮样式
            filterBtns.forEach(btn => {
                btn.classList.toggle('active', btn.getAttribute('data-filter') === filterType);
            });

            // 过滤产品卡片
            productCards.forEach(card => {
                if (filterType === 'all' || card.getAttribute('data-type') === filterType) {
                    card.style.display = 'flex';
                    count++;
                } else {
                    card.style.display = 'none';
                }
            });

            // 显示无产品提示
            noProductsMsg.style.display = (count === 0) ? 'block' : 'none';
        }

        // 监听按钮点击
        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => applyFilter(btn.getAttribute('data-filter')));
        });

        // 核心跳转逻辑：检查 URL 参数
        window.onload = () => {
            const params = new URLSearchParams(window.location.search);
            const type = params.get('type') || 'all';
            applyFilter(type);
        };
    </script>
</body>
</html>
