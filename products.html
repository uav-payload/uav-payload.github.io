<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products - UAV Payload Technology</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        /* 基础样式与布局优化 */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background-color: #0b1120; color: #f1f5f9; line-height: 1.6; }

        header { background-color: rgba(11, 17, 32, 0.9); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 100; border-bottom: 1px solid #1e293b; }
        nav { max-width: 1200px; margin: 0 auto; padding: 20px; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.5rem; font-weight: 800; color: #fff; text-decoration: none; }
        .logo span { color: #0ea5e9; }
        .nav-links a { color: #cbd5e1; text-decoration: none; margin-left: 30px; font-weight: 600; transition: color 0.3s; }
        .nav-links a:hover { color: #0ea5e9; }

        /* 分类导航栏 - 支持多行自动换行 */
        .filter-nav { max-width: 1200px; margin: 30px auto; padding: 0 20px; display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
        .filter-btn { 
            padding: 10px 18px; 
            background: #1e293b; 
            border: 1px solid #334155; 
            color: #cbd5e1; 
            border-radius: 30px; 
            cursor: pointer; 
            font-weight: 600; 
            transition: all 0.3s; 
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .filter-btn.active, .filter-btn:hover { background: #0ea5e9; color: #fff; border-color: #0ea5e9; box-shadow: 0 0 15px rgba(14, 165, 233, 0.4); }

        .container { max-width: 1200px; margin: 0 auto; padding: 20px; min-height: 500px; }
        
        /* 产品网格容器 */
        .product-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); 
            gap: 25px; 
            transition: opacity 0.3s ease;
        }

        /* 暂无产品提示 */
        #no-products {
            display: none;
            text-align: center;
            padding: 100px 20px;
            color: #64748b;
            font-size: 1.2rem;
            width: 100%;
        }
        
        /* 产品卡片样式预留 (后续添加产品时自动生效) */
        .product-card { 
            background: #1e293b; 
            border-radius: 12px; 
            border: 1px solid #334155; 
            overflow: hidden; 
            transition: 0.3s; 
            display: flex; 
            flex-direction: column; 
        }
        .product-card:hover { transform: translateY(-5px); border-color: #0ea5e9; box-shadow: 0 10px 30px rgba(0,0,0,0.4); }
        .product-img { width: 100%; height: 200px; background: #0f172a; position: relative; display: flex; align-items: center; justify-content: center; }
        .product-img img { max-width: 90%; max-height: 90%; object-fit: contain; }
        .badge { position: absolute; top: 12px; right: 12px; background: rgba(14, 165, 233, 0.1); color: #0ea5e9; padding: 2px 10px; border-radius: 10px; font-size: 0.7rem; font-weight: 800; border: 1px solid #0ea5e9; text-transform: uppercase; }
        .product-detail { padding: 20px; flex-grow: 1; }
        .product-detail h3 { color: #fff; margin-bottom: 8px; font-size: 1.1rem; }
        .product-detail p { color: #94a3b8; font-size: 0.85rem; margin-bottom: 15px; }
        .specs { border-top: 1px solid #334155; padding-top: 15px; margin-top: auto; }
        .spec-item { display: flex; justify-content: space-between; font-size: 0.8rem; margin-bottom: 4px; }
        .spec-label { color: #64748b; }
        .spec-value { color: #cbd5e1; font-weight: 600; }

        footer { text-align: center; padding: 60px 40px; color: #475569; font-size: 0.9rem; border-top: 1px solid #1e293b; margin-top: 50px; }
    </style>
</head>
<body>

    <header>
        <nav>
            <a href="index.html" class="logo">UAV <span>Payload</span></a>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="products.html" style="color: #0ea5e9;">Products</a>
                <a href="about.html">About</a>
                <a href="news.html">News</a>
                <a href="contact.html">Contact</a>
            </div>
        </nav>
    </header>

    <div class="filter-nav">
        <button class="filter-btn active" data-filter="all">All Solutions</button>
        <button class="filter-btn" data-filter="emergency">Emergency & Delivery</button>
        <button class="filter-btn" data-filter="public-safety">Public Safety</button>
        <button class="filter-btn" data-filter="firefighting">Firefighting</button>
        <button class="filter-btn" data-filter="radar">Radar Systems</button>
        <button class="filter-btn" data-filter="cleaning">UAV Cleaning</button>
        <button class="filter-btn" data-filter="fpv">FPV Drone</button>
        <button class="filter-btn" data-filter="countermeasure">Countermeasure</button>
        <button class="filter-btn" data-filter="antenna">Anti-Interference Antenna</button>
        <button class="filter-btn" data-filter="gimbal">Gimbal & Lens</button>
        <button class="filter-btn" data-filter="vtol">VTOL Fixed-wing</button>
    </div>

    <div class="container">
        <div id="no-products">No products found in this category. Coming soon!</div>

        <div class="product-grid" id="product-list">
            </div>
    </div>

    <footer>
        <p>© 2026 UAV Payload Technology. All rights reserved.</p>
    </footer>

    <script>
        const filterBtns = document.querySelectorAll('.filter-btn');
        const productList = document.getElementById('product-list');
        const noProductsMsg = document.getElementById('no-products');

        function applyFilter(filterType) {
            const cards = document.querySelectorAll('.product-card');
            let visibleCount = 0;

            // 更新按钮状态
            filterBtns.forEach(btn => {
                btn.classList.toggle('active', btn.getAttribute('data-filter') === filterType);
            });

            // 执行过滤逻辑
            cards.forEach(card => {
                if (filterType === 'all' || card.getAttribute('data-type') === filterType) {
                    card.style.display = 'flex';
                    visibleCount++;
                } else {
                    card.style.display = 'none';
                }
            });

            // 如果当前分类下没有产品，显示提示信息
            noProductsMsg.style.display = (visibleCount === 0) ? 'block' : 'none';
        }

        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                const filter = btn.getAttribute('data-filter');
                applyFilter(filter);
            });
        });

        // 初始化：检查 URL 参数（配合首页跳转）
        window.onload = () => {
            const params = new URLSearchParams(window.location.search);
            const type = params.get('type') || 'all';
            applyFilter(type);
        };
    </script>
</body>
</html>
