<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products - UAV Payload Solutions</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        /* 保持之前的样式，仅对导航栏做微调 */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background-color: #0b1120; color: #f1f5f9; line-height: 1.6; }

        header { background-color: rgba(11, 17, 32, 0.9); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 100; border-bottom: 1px solid #1e293b; }
        nav { max-width: 1200px; margin: 0 auto; padding: 20px; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.5rem; font-weight: 800; color: #fff; text-decoration: none; }
        .logo span { color: #0ea5e9; }
        .nav-links a { color: #cbd5e1; text-decoration: none; margin-left: 30px; font-weight: 600; transition: color 0.3s; }
        .nav-links a:hover { color: #0ea5e9; }

        /* 导航栏：增加 All Solutions */
        .filter-nav { max-width: 1200px; margin: 30px auto; padding: 0 20px; display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
        .filter-btn { 
            padding: 10px 18px; 
            background: #1e293b; 
            border: 1px solid #334155; 
            color: #cbd5e1; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: 600; 
            transition: 0.3s; 
            font-size: 0.8rem;
            text-transform: uppercase;
        }
        .filter-btn.active, .filter-btn:hover { background: #0ea5e9; color: #fff; border-color: #0ea5e9; box-shadow: 0 4px 15px rgba(14, 165, 233, 0.3); }

        .container { max-width: 1200px; margin: 0 auto; padding: 20px; min-height: 60vh; }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 25px; }
        
        .product-card { background: #1e293b; border-radius: 12px; border: 1px solid #334155; overflow: hidden; transition: 0.3s; display: flex; flex-direction: column; cursor: pointer; }
        .product-card:hover { transform: translateY(-5px); border-color: #0ea5e9; }
        
        .product-img { width: 100%; height: 220px; background: #0f172a; position: relative; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .product-img img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .badge { position: absolute; top: 12px; right: 12px; background: rgba(14, 165, 233, 0.1); color: #0ea5e9; padding: 4px 10px; border-radius: 4px; font-size: 0.65rem; font-weight: 800; border: 1px solid #0ea5e9; }

        .product-detail { padding: 20px; flex-grow: 1; }
        .product-detail h3 { color: #fff; margin-bottom: 8px; font-size: 1.1rem; }
        .product-detail p { color: #94a3b8; font-size: 0.85rem; margin-bottom: 15px; height: 3.2em; overflow: hidden; }
        
        .specs { border-top: 1px solid #334155; padding-top: 12px; }
        .spec-item { display: flex; justify-content: space-between; font-size: 0.8rem; margin-bottom: 4px; }
        .spec-label { color: #64748b; }
        .spec-value { color: #cbd5e1; }

        #no-products { display: none; text-align: center; padding: 100px; color: #64748b; }
        footer { text-align: center; padding: 40px; color: #475569; font-size: 0.8rem; border-top: 1px solid #1e293b; margin-top: 50px; }
    </style>
</head>
<body>

    <header>
        <nav>
            <a href="index.html" class="logo">UAV <span>Payload</span></a>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="products.html" style="color: #0ea5e9;">Products</a>
                <a href="contact.html">Contact</a>
            </div>
        </nav>
    </header>

    <div class="filter-nav">
        <button class="filter-btn active" data-filter="all">All Solutions</button>
        <button class="filter-btn" data-filter="dock">Dock Series</button>
        <button class="filter-btn" data-filter="matrice4t">M30/M4T Series</button>
        <button class="filter-btn" data-filter="cargo">Cargo & Fire</button>
        <button class="filter-btn" data-filter="matrice400">M400 Series</button>
        <button class="filter-btn" data-filter="radar">Radar Systems</button>
        <button class="filter-btn" data-filter="others">Others</button>
    </div>

    <div class="container">
        <div id="no-products">No products found.</div>
        <div class="product-grid" id="product-list">
            
            <div class="product-card" data-type="matrice400" onclick="location.href='product-ft100max.html'">
                <div class="product-img">
                    <span class="badge">M400 Series</span>
                    <img src="images/FT100PMAX1.jpg" alt="FT100 MAX">
                </div>
                <div class="product-detail">
                    <h3>FT100 MAX Visual Drop System</h3>
                    <p>4-stage dropper with 1080P camera and high-intensity warning lights.</p>
                    <div class="specs">
                        <div class="spec-item"><span class="spec-label">Model</span><span class="spec-value">FT100 MAX</span></div>
                        <div class="spec-item"><span class="spec-label">Compatibility</span><span class="spec-value">Matrice 400</span></div>
                    </div>
                </div>
            </div>

            </div>
    </div>

    <footer><p>© 2026 UAV Payload Technology.</p></footer>

    <script>
        const filterBtns = document.querySelectorAll('.filter-btn');
        const productCards = document.querySelectorAll('.product-card');
        const noProductsMsg = document.getElementById('no-products');

        function applyFilter(filterType) {
            let found = 0;
            filterBtns.forEach(btn => {
                btn.classList.toggle('active', btn.getAttribute('data-filter') === filterType);
            });

            productCards.forEach(card => {
                // 如果是 'all'，显示所有；否则匹配 data-type
                if (filterType === 'all' || card.getAttribute('data-type') === filterType) {
                    card.style.display = 'flex';
                    found++;
                } else {
                    card.style.display = 'none';
                }
            });
            noProductsMsg.style.display = (found === 0) ? 'block' : 'none';
        }

        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => applyFilter(btn.getAttribute('data-filter')));
        });

        window.onload = () => {
            const params = new URLSearchParams(window.location.search);
            // 关键：如果没有传 type，则默认显示 'all'
            const type = params.get('type') || 'all'; 
            applyFilter(type);
        };
    </script>
</body>
</html>
