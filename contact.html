<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - UAV Payload Technology</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b1120;
            color: #f1f5f9;
            line-height: 1.6;
            text-align: center;
        }

        /* 导航栏 - 与首页保持一致 */
        header {
            background-color: rgba(11, 17, 32, 0.9);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid #1e293b;
        }
        nav {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo { font-size: 1.5rem; font-weight: 800; color: #fff; text-decoration: none; }
        .logo span { color: #0ea5e9; }
        .nav-links a { color: #cbd5e1; text-decoration: none; margin-left: 30px; font-weight: 600; transition: color 0.3s; }
        .nav-links a:hover { color: #0ea5e9; }

        /* 内容区 */
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 80px 20px;
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 20px;
            background: -webkit-linear-gradient(45deg, #fff, #0ea5e9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle { color: #94a3b8; margin-bottom: 40px; font-size: 1.2rem; }

        .contact-card {
            background-color: #1e293b;
            padding: 40px;
            border-radius: 20px;
            border: 1px solid #334155;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .info-group { margin-bottom: 30px; }
        .info-group p { font-size: 1.1rem; margin-bottom: 15px; color: #cbd5e1; }

        /* 按钮设计 */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin: 10px;
            padding: 14px 28px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 700;
            transition: all 0.3s ease;
            color: white;
            min-width: 200px;
        }

        .btn-email { background: linear-gradient(135deg, #0ea5e9, #2563eb); }
        .btn-whatsapp { background: linear-gradient(135deg, #22c55e, #16a34a); }
        .btn-social { background: #334155; border: 1px solid #475569; }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(14, 165, 233, 0.3);
            filter: brightness(1.1);
        }

        .btn-whatsapp:hover { box-shadow: 0 10px 20px rgba(34, 197, 94, 0.3); }

        footer {
            margin-top: 100px;
            padding: 40px;
            background: #020617;
            color: #64748b;
            border-top: 1px solid #1e293b;
        }
    </style>
</head>
<body>

    <header>
        <nav>
            <a href="index.html" class="logo">UAV <span>Payload</span></a>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="products.html">Products</a>
                <a href="about.html">About</a>
                <a href="news.html">News</a>
                <a href="contact.html" style="color: #0ea5e9;">Contact</a>
            </div>
        </nav>
    </header>

    <div class="container">
        <h1>Contact Us</h1>
        <p class="subtitle">Have questions or need technical support? We're here to help.</p>

        <div class="contact-card">
            <div class="info-group">
                <p>Reach us directly via Email or WhatsApp</p>
                <a class="btn btn-email" href="mailto:18715768852@163.com">Send Email</a>
                <a class="btn btn-whatsapp" href="https://wa.me/8618715768852" target="_blank">WhatsApp Chat</a>
            </div>

            <hr style="border: 0; border-top: 1px solid #334155; margin: 30px 0;">

            <div class="info-group">
                <p>Follow our latest updates</p>
                <a class="btn btn-social" href="https://facebook.com/profile.php?id=61576931206243" target="_blank">Facebook</a>
                <a class="btn btn-social" href="https://www.youtube.com/@Brucezhao-y9n" target="_blank">YouTube</a>
            </div>
        </div>
    </div>

    <footer>
        <p>© 2026 UAV Payload Technology. All rights reserved.</p>
    </footer>

</body>
</html>
