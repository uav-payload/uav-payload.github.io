<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UAV Payload Technology</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        /* 全局重置与基础设置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b1120; /* 深邃的科技暗色背景 */
            color: #f1f5f9; /* 柔和的亮灰色文字 */
            line-height: 1.6;
        }

        /* 导航栏设计 */
        header {
            background-color: rgba(11, 17, 32, 0.9);
            backdrop-filter: blur(10px); /* 毛玻璃效果 */
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid #1e293b;
        }
        nav {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            color: #fff;
            text-decoration: none;
            letter-spacing: 1px;
        }
        .logo span {
            color: #0ea5e9;
        }
        .nav-links a {
            color: #cbd5e1;
            text-decoration: none;
            margin-left: 30px;
            font-weight: 600;
            transition: color 0.3s;
        }
        .nav-links a:hover {
            color: #0ea5e9;
        }

        /* 修复后的全屏视频 Banner 容器（修正类名为 .hero-section） */
        .hero-section {
            position: relative;
            width: 100%;
            height: 80vh; /* 占浏览器高度的 80%，如需完全铺满全屏可改为 100vh */
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0f172a;
        }

        /* 背景视频全屏自适应裁剪 */
        .bg-video {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            object-fit: cover;
            z-index: 1;
        }

        /* 视频上方的深色半透明黑纱遮罩，压暗视频以保证白色文字清晰可见 */
        .hero-section::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.65); /* 65% 透明度的深蓝色遮罩，极具科技官网质感 */
            z-index: 2;
        }

        /* 文字内容层级调最高，排版美化 */
        .hero-content {
            position: relative;
            z-index: 3;
            text-align: center;
            color: #ffffff;
            padding: 0 20px;
            max-width: 800px;
        } 
        .hero-content h1 {
            font-size: 3.5rem;
            font-weight: 800;
            margin-bottom: 20px;
            letter-spacing: -1px;
            background: linear-gradient(45deg, #fff, #0ea5e9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .hero-content p {
            font-size: 1.25rem;
            color: #94a3b8;
            margin-bottom: 30px;
        }

        /* 补全：科技感主按钮样式 */
        .btn {
            display: inline-block;
            padding: 12px 32px;
            background-color: #0ea5e9;
            color: #fff;
            text-decoration: none;
            font-weight: 600;
            border-radius: 8px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(14, 165, 233, 0.3);
        }
        .btn:hover {
            background-color: #0284c7;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(14, 165, 233, 0.5);
        }

        /* 核心内容区布局 */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 80px 20px;
        }
        h2 {
            text-align: center;
            font-size: 2.2rem;
            margin-bottom: 50px;
            color: #fff;
            letter-spacing: -0.5px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
        }
        .card {
            background-color: #1e293b;
            padding: 30px;
            border-radius: 16px; /* 稍微加圆润了一点，更符合现代设计 */
            border: 1px solid #334155;
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease
